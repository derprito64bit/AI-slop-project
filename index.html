<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find where you actually get in — real university admission requirements, personalized to your profile." />
    <meta name="theme-color" content="#3f5bd9" />

    <!-- Social sharing (Open Graph / Twitter). Add an og:image once we have artwork. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Admit" />
    <meta property="og:title" content="Admit — find where you actually get in" />
    <meta
      property="og:description"
      content="Official sites give vague cutoffs. See real admission averages, personalized to your grades and interests."
    />
    <meta property="og:url" content="https://derprito64bit.github.io/AI-slop-project/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Admit — find where you actually get in" />
    <meta
      name="twitter:description"
      content="Official sites give vague cutoffs. See real admission averages, personalized to your grades and interests."
    />
    <!-- Fonts: Inter (UI) + Fraunces (educational display serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Admit — find where you actually get in</title>
    <!-- Set theme before first paint to avoid a flash. Defaults to light;
         only uses a stored choice if the user has toggled before. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
